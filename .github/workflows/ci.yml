name: CI

on:
  push:
    branches: [main, develop, "lab*", "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Контракт OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости проверки
        run: pip install pyyaml openapi-spec-validator

      - name: Проверить контракт
        run: python api-tests/validate_contract.py

  test:
    name: Тесты, покрытие и Swagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить pytest с покрытием
        run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Загрузить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      # === ПУНКТ 11 МЕТОДИЧЕСКИХ УКАЗАНИЙ: Генерация файлов для Swagger ===
      - name: Сгенерировать спецификацию Swagger (OpenAPI JSON)
        run: python scripts/export_openapi.py

      - name: Загрузить артефакты Swagger
        uses: actions/upload-artifact@v4
        with:
          name: swagger-spec
          path: |
            openapi/openapi.json
            openapi/openapi.yaml
          if-no-files-found: warn

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [test]
    # Шаг выполнится, только если задан токен SonarQube в Secrets
    # (чтобы сборка не падала до момента настройки облачного SonarQube)
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Скачать отчёт о покрытии
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Сканирование SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ai-coach-backend
            -Dsonar.qualitygate.wait=true

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: [contract, test, sonar]
    steps:
      - uses: actions/checkout@v4

      - name: Проверить compose-файл
        run: docker compose config --quiet

      - name: Собрать образ
        run: docker build -t ai-coach-backend:ci .